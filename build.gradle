// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.2.21'
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        flatDir {
            dirs project(':common').file('aars')
        }
    }
}

ext {
    toolsVersion = properties.get('TOOLS_VERSION', '35.0.0')
    compileApi = properties.get('COMPILE_API', 36)
    targetApi = properties.get('TARGET_API', 36)
    minApi = properties.get('MIN_API', 21)
}

/*
 * Aligne la cible JVM des taches Kotlin sur celle des taches Java (21).
 *
 * Sans cela Kotlin reste a sa valeur par defaut (17) alors que `compileOptions` demande 21 pour
 * chaque module : Gradle refuse la compilation (« Inconsistent JVM Target Compatibility ») et il
 * fallait jusqu'ici passer `kotlin.jvm.target.validation.mode=warning` pour contourner le
 * controle. Le desaccord reste alors invisible jusqu'a l'execution, sous forme de
 * `UnsupportedClassVersionError`. Une seule cible, declaree une seule fois.
 */
subprojects { subproject ->
    subproject.plugins.withId('org.jetbrains.kotlin.android') {
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
            compilerOptions {
                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
            }
        }
    }
}

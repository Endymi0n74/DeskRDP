apply plugin: 'com.android.application'

/*
 * DualDesk application module.
 *
 * Same code base and same resources as freeaRDP-app: the RDP client, its settings screens and
 * its resources live in :bVNC, and every application variant in this repository is only a
 * manifest plus a namespace. What makes this one ours is the RustDesk connection type handled by
 * the connection grid (see com.dualdesk.rustdesk).
 *
 * The application id must keep the letters "rdp": Utils.isRdp() decides which protocol an
 * application speaks from its package name alone.
 */
/*
 * Signature de publication.
 *
 * La cle vit dans `_keystore/`, ignore par git : elle n'a rien a faire dans l'historique, et
 * la perdre rend toute mise a jour impossible (Android refuse une APK signee d'une autre cle).
 * Quand le fichier est absent — clone neuf, machine de compilation — le variant release est
 * simplement non signe : `assembleDebug` continue de fonctionner comme avant.
 */
/*
 * Embedded RustDesk core.
 *
 * The heart is a 32 MB arm64-v8a shared library produced by
 * `rustdesk-src` (see docs/RUSTDESK-NATIF.md). It is NOT versioned: the repository is a client, not
 * a binary dump, and the library is reproducible from its sources. A build that wants the embedded
 * session passes the file explicitly:
 *
 *     ./gradlew :dualdesk-app:assembleRelease \
 *         -Pdualdesk.rustdeskLib=/path/to/librustdesk.so
 *
 * Without the property the APK simply has no `librustdesk.so`: the grid then keeps handing the
 * session to the installed RustDesk application, which is the behaviour of 1.10.
 */
def rustdeskLib = project.findProperty('dualdesk.rustdeskLib')
def rustdeskJniDir = layout.buildDirectory.dir('rustdeskJni')

def keystorePropsFile = rootProject.file('_keystore/keystore.properties')
def keystoreProps = new java.util.Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    compileSdkVersion compileApi

    defaultConfig {
        targetSdkVersion targetApi
        minSdkVersion project.getProperties().get("SDK_VERSION")
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    namespace 'com.dualdesk.rdp'

    sourceSets {
        main {
            jniLibs.srcDirs += rustdeskJniDir
        }
    }

    lint {
        disable 'Instantiatable'
    }
}

/*
 * Places the core where Android expects it: lib/arm64-v8a/librustdesk.so.
 *
 * The task is a no-op when the property is absent, so the ordinary build stays unchanged; when it
 * is present, `preBuild` copies the file into the generated directory, which is itself a source
 * set — nothing is written into `src/`, so the tree stays clean.
 */
tasks.register('copieRustDeskLib', Copy) {
    group = 'dualdesk'
    description = 'Copie librustdesk.so (arm64-v8a) dans les jniLibs du variant, si fournie.'
    if (rustdeskLib) {
        from file(rustdeskLib)
        rename { 'librustdesk.so' }
        into rustdeskJniDir.map { it.dir('arm64-v8a') }
    }
}

tasks.named('preBuild') {
    dependsOn 'copieRustDeskLib'
}

/*
 * Controle avant publication.
 *
 * `assembleRelease` reussit aussi bien avec la cle de publication qu'avec aucune, ou qu'avec la
 * cle de debogage : la signature est le seul point qu'une compilation ne verifie pas, et le
 * symptome n'apparait que chez l'utilisateur (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Cette tache
 * relit le certificat des APK produits et refuse tout ce qui n'est pas la cle attendue.
 *
 * Elle reste volontairement hors de `assembleRelease` : un clone neuf, sans `_keystore/`, doit
 * continuer de compiler. `PYTHON` permet de designer l'interpreteur si `python` n'est pas dans le
 * PATH.
 */
tasks.register('verifieSignatureRelease', Exec) {
    group = 'verification'
    description = 'Verifie que les APK de release portent la cle de publication attendue.'
    dependsOn 'assembleRelease'
    workingDir rootProject.projectDir
    commandLine(System.getenv('PYTHON') ?: 'python', '_check/verifie_signature.py')
}

dependencies {
    api 'com.android.support:multidex:1.0.3'
    implementation project(':bVNC')
    implementation project(':pubkeyGenerator')
}
